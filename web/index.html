<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HackDay Chat</title>
  <link rel="icon" href="assets/icon/app.ico">
  <link rel="stylesheet" href="styles.css">
  <!-- Computer Modern fonts used by text inside the TeX-rendered SVGs (bundled for offline use) -->
  <link rel="stylesheet" href="assets/tikz-fonts/fonts.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="logo-lboro" src="assets/logos/lboro.svg" alt="Loughborough University">
      </div>
      <button class="new-thread" id="newThread">+ New thread</button>
      <nav class="threads" id="threads"></nav>
      <div class="sidebar-footer">
        <span>Digitech Hackathon with</span>
        <img class="logo-mlh" src="assets/logos/mlh-logo-white.svg" alt="Major League Hacking">
      </div>
    </aside>

    <main class="chat" id="chat">
      <!-- Sits over the empty-state slot, then shrinks into the header corner once a thread starts -->
      <img class="logo-mlh-color" id="mlhLogo" src="assets/logos/mlh-logo-color.svg" alt="Major League Hacking">
      <header class="chat-header">
        <button class="icon-btn menu" id="menuBtn" aria-label="Toggle threads">&#9776;</button>
        <h1 id="threadTitle">New thread</h1>
      </header>

      <section class="messages" id="messages">
        <div class="empty" id="empty">
          <div class="logo-slot" id="logoSlot"></div>
          <h2>Start hacking</h2>
          <p>Upload a photo of your notes: get them back clean and typeset, then get quizzed on them.</p>
        </div>
      </section>

      <div class="composer">
        <div class="composer-row" id="uploadRow">
        <label class="dropzone" id="dropzone">
          <input type="file" id="fileInput" accept="image/*" multiple hidden>
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span class="dropzone-text" id="dropzoneText"><strong>Drop a photo of your notes</strong> or click to browse</span>
        </label>
        <button type="button" class="camera-btn" id="cameraBtn" aria-label="Take a photo with the camera">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span>Camera</span>
        </button>
        </div>

        <!-- Shown instead of the upload row while a quiz is running -->
        <form class="quiz-row" id="quizRow" hidden>
          <div class="composer-row">
            <textarea id="answerInput" rows="2" placeholder="Type your answer…"></textarea>
            <button type="submit" class="answer-send" id="answerSend">Send</button>
          </div>
          <div class="quiz-hint">
            <span>Enter to send · Shift+Enter for a new line</span>
            <button type="button" class="end-quiz" id="endQuiz">End quiz</button>
          </div>
        </form>
      </div>

      <dialog class="camera-dialog" id="cameraDialog">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <p class="camera-error" id="cameraError" hidden></p>
        <div class="camera-controls">
          <button type="button" class="camera-secondary" id="cameraCancel">Cancel</button>
          <button type="button" class="camera-shutter" id="cameraCapture" aria-label="Capture photo"></button>
          <button type="button" class="camera-secondary" id="cameraSwitch" hidden>Switch</button>
        </div>
      </dialog>

      <div class="drop-overlay" aria-hidden="true"><span>Drop to digitise your notes</span></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
